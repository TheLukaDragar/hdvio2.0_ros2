svo:
  ros__parameters:
    ############################
    ##### Basic parameters #####
    ############################

    # Automatic initialisation
    automatic_reinitialization: True

    # Pipeline type
    pipeline_is_stereo: False

    # Feature and keyframe number
    max_fts: 180
    max_n_kfs: 10
    max_map_fts: 220
    quality_min_fts: 40

    # Map scale when initialized (not used for stereo)
    map_scale: 5.0

    # Initial rotation
    "T_world_imuinit/qx": 0.0
    "T_world_imuinit/qy": 0.0
    "T_world_imuinit/qz": 0.0
    "T_world_imuinit/qw": 1.0
    "T_world_imuinit/tx": 0.0
    "T_world_imuinit/ty": 0.0
    "T_world_imuinit/tz": 0.0

    # Keyframe selection
    kfselect_criterion: "FORWARD"
    kfselect_numkfs_upper_thresh: 140
    kfselect_numkfs_lower_thresh: 100.0
    kfselect_min_dist_metric: 0.1
    kfselect_min_angle: 20.0
    kfselect_min_disparity: 40.0
    update_seeds_with_old_keyframes: True

    # Affine compensation (disabled for speed)
    img_align_est_illumination_gain: false
    img_align_est_illumination_offset: false
    depth_filter_affine_est_offset: false
    depth_filter_affine_est_gain: false
    reprojector_affine_est_offset: false
    reprojector_affine_est_gain: false

    # Pinhole radtan specific - NO distortion jacobian needed
    img_align_use_distortion_jacobian: False
    poseoptim_using_unit_sphere: False
    scan_epi_unit_sphere: False

    ########################################
    ###### Tuning for each module ##########
    ########################################
    # Initialization - balanced thresholds for stable map creation
    init_min_inliers: 15
    init_min_features: 50
    init_min_tracked: 40
    init_min_disparity: 15.0
    init_disparity_pivot_ratio: 0.5
    reproj_err_thresh: 2.0

    # Feature Detection (adjusted for 640x480)
    grid_size: 20
    n_pyr_levels: 3
    detector_threshold_primary: 10
    detector_threshold_secondary: 200
    detector_threshold_shitomasi: 50

    # Image Alignment (adjusted for 640x480)
    img_align_max_level: 3
    img_align_min_level: 2

    # Reprojection
    use_async_reprojectors: False
    reprojector_max_n_kfs: 5
    reproject_unconverged_seeds: True
    max_unconverged_seeds_ratio: 0.2

    # Pose Optimization
    poseoptim_thresh: 2.0

    # Depth Filter
    seed_convergence_sigma2_thresh: 200.0
    mappoint_convergence_sigma2_thresh: 500.0

    relocalization_max_trials: 10

    # IMU priors
    poseoptim_prior_lambda: 0.0
    img_align_prior_lambda_rot: 0.0
    img_align_prior_lambda_trans: 0.0

    # Dense input
    publish_every_nth_dense_input: 5

    # Visualization
    publish_marker_scale: 0.5
    publish_active_kfs: True

    # Stereo parameters (not used for mono)
    max_depth_inv: 0.05
    min_depth_inv: 1.0
    mean_depth_inv: 0.3

    ##############################
    ##### Backend parameters #####
    ##############################
    ceres_verbose: false
    ceres_marginalize: true
    ceres_num_iterations: 3
    ceres_num_imu_frames: 3
    ceres_max_iteration_time: 0.05
    skip_optimization_when_tracking_bad: true
    publish_marker_scale_backend: 0.5
    backend_only_use_corners: false
    backend_scale_stable_thresh: 0.02

    # Loop Correction
    ransac3d_inlier_percent: 35

    # Outlier rejection
    use_outlier_rejection: true
    outlier_rejection_px_threshold: 2.0

    # Zero Motion Detection
    backend_use_zero_motion_detection: false
    backend_zero_motion_check_n_frames: 5
    zero_motion_px_diff_threshold: 0.2
    zero_motion_ratio_moving_pixels_threshold: 0.1
    zero_motion_min_number_correspondences: 5
    zero_motion_max_features_to_check: 15
    zero_motion_sigma: 0.1

    # Trace statistics
    trace_statistics: false
    trace_dir: "/tmp"

    # Camera calibration file - ABSOLUTE PATH
    calib_file: "/home/lampy/hdvio2.0/hdvio2/param/calib/camera_calib8_e.yaml"
    
    # Use dynamics
    use_dynamics: false
